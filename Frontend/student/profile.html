<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | SCMS</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>renderNav("student")</script><main class="page"><div class="container"><h1>My Profile</h1><div class="form-card" style="margin-left:0"><div id="msg"></div><form id="profileForm"><div class="form-group"><label>Full Name</label><input id="name"></div><div class="form-group"><label>Register Number</label><input id="regNo"></div><div class="form-group"><label>Email</label><input id="email" type="email" readonly></div><div class="form-group"><label>Department</label><input value="B.Sc. Computer Science with AI"></div><button class="btn">Save Changes</button></form></div></div></main>
<script>if(protect("student")){let s=currentStudent();name.value=s.name;regNo.value=s.registerNo;email.value=s.email;profileForm.onsubmit=e=>{e.preventDefault();s.name=name.value;s.registerNo=regNo.value;saveData("scms_student",s);msg.innerHTML='<div class="alert">Profile updated successfully.</div>'}}</script>

<script src="../js/main.js"></script>
</body>
</html>
