<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SCMS</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(79,70,229,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(37,99,235,.10),
                    transparent 30%
                ),
                #f7f8fc;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-navbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #e8ecf2;
            display: flex;
            align-items: center;
        }

        .auth-navbar-inner {
            width: min(1180px,92%);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-home {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .back-home:hover {
            color: #4f46e5;
        }

        .auth-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .register-card {
            width: min(720px,100%);
            background: white;
            border: 1px solid #e5e9f1;
            border-radius: 22px;
            padding: 45px;
            box-shadow: 0 25px 70px rgba(15,23,42,.09);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-icon {
            width: 54px;
            height: 54px;
            margin: auto;
            border-radius: 15px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 17px;
        }

        .register-header span {
            color: #4f46e5;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .register-header h1 {
            font-size: 28px;
            margin: 7px 0;
        }

        .register-header p {
            color: #64748b;
            font-size: 12px;
        }

        .register-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 18px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 13px;
        }

        .form-input {
            width: 100%;
            height: 46px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            padding: 0 40px;
            outline: none;
            color: #1e293b;
            font-size: 13px;
        }

        .form-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99,102,241,.1);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #94a3b8;
        }

        .terms {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            color: #64748b;
            font-size: 11px;
            margin: 5px 0 20px;
        }

        .terms input {
            margin-top: 2px;
            accent-color: #4f46e5;
        }

        .terms a {
            color: #4f46e5;
            font-weight: 600;
        }

        .register-submit {
            grid-column: 1 / -1;
            width: 100%;
            height: 46px;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 12px;
        }

        .login-text a {
            color: #4f46e5;
            font-weight: 700;
        }

        .field-error {
            display: block;
            color: #dc2626;
            font-size: 10px;
            margin-top: 5px;
        }

        .input-error {
            border-color: #ef4444 !important;
        }

        .register-error {
            grid-column: 1 / -1;
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 18px;
            font-size: 11px;
        }

        @media(max-width:650px) {

            .register-card {
                padding: 30px 22px;
            }

            .register-form {
                grid-template-columns: 1fr;
            }

            .form-group.full,
            .terms,
            .register-submit,
            .register-error {
                grid-column: 1;
            }
        }

    </style>

</head>


<body>

<div class="auth-page">

    <header class="auth-navbar">

        <div class="auth-navbar-inner">

            <a href="../index.html" class="logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div>
                    <span class="logo-title">SCMS</span>
                    <small>Learning Platform</small>
                </div>

            </a>

            <a
                href="../index.html"
                class="back-home"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </header>


    <main class="auth-main">

        <div class="register-card">

            <div class="register-header">

                <div class="register-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <span>STUDENT REGISTRATION</span>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Join SCMS and start building your skills today.
                </p>

            </div>


            <form
                class="register-form"
                id="registerForm"
            >

                <div
                    class="register-error"
                    id="registerError"
                ></div>


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="name"
                            class="form-input"
                            placeholder="Enter your full name"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter your email"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Minimum 6 characters"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="Re-enter your password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <span>
                        I agree to the SCMS
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn btn-primary register-submit"
                >
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </main>

</div>


<script src="../js/data.js"></script>
<script src="../js/state.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/validation.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "registerForm"
            );

        const name =
            document.getElementById("name");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const terms =
            document.getElementById("terms");

        const errorBox =
            document.getElementById(
                "registerError"
            );


        document
            .querySelectorAll(".password-toggle")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function () {

                        const target =
                            document.getElementById(
                                this.dataset.target
                            );

                        const visible =
                            target.type === "text";

                        target.type =
                            visible
                                ? "password"
                                : "text";

                        this.innerHTML =
                            visible
                                ? '<i class="fa-regular fa-eye"></i>'
                                : '<i class="fa-regular fa-eye-slash"></i>';

                    }
                );

            });


        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                errorBox.style.display =
                    "none";


                document
                    .querySelectorAll(".form-input")
                    .forEach(input => {
                        clearFieldError(input);
                    });


                if (
                    !validateRequired(
                        name.value
                    )
                ) {

                    showFieldError(
                        name,
                        "Please enter your full name."
                    );

                    return;
                }


                if (
                    !validateEmail(
                        email.value
                    )
                ) {

                    showFieldError(
                        email,
                        "Please enter a valid email address."
                    );

                    return;
                }


                if (
                    !validatePassword(
                        password.value
                    )
                ) {

                    showFieldError(
                        password,
                        "Password must contain at least 6 characters."
                    );

                    return;
                }


                if (
                    password.value !==
                    confirmPassword.value
                ) {

                    showFieldError(
                        confirmPassword,
                        "Passwords do not match."
                    );

                    return;
                }


                if (!terms.checked) {

                    errorBox.textContent =
                        "Please accept the Terms of Service and Privacy Policy.";

                    errorBox.style.display =
                        "block";

                    return;
                }


                const students =
                    getStudents();


                const exists =
                    students.some(
                        student =>
                            student.email.toLowerCase() ===
                            email.value.trim().toLowerCase()
                    );


                if (exists) {

                    errorBox.textContent =
                        "An account with this email already exists.";

                    errorBox.style.display =
                        "block";

                    return;
                }


                const newStudent = {

                    id: Date.now(),

                    name:
                        name.value.trim(),

                    email:
                        email.value.trim(),

                    password:
                        password.value,

                    role: "student",

                    status: "Active"

                };


                students.push(newStudent);


                saveData(
                    STORAGE_KEYS.students,
                    students
                );


                saveData(
                    STORAGE_KEYS.studentSession,
                    newStudent
                );


                showToast(
                    "Account created successfully!"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "dashboard.html";

                    },
                    600
                );

            }
        );

    }
);

</script>

</body>
</html>
