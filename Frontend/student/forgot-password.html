<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | SCMS</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="../css/style.css">


    <style>

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(79,70,229,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(37,99,235,.10),
                    transparent 30%
                ),
                #f7f8fc;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-navbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #e8ecf2;
            display: flex;
            align-items: center;
        }

        .auth-navbar-inner {
            width: min(1180px,92%);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-home {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .back-home:hover {
            color: #4f46e5;
        }

        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .forgot-card {
            width: min(470px,100%);
            background: white;
            border: 1px solid #e5e9f1;
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 25px 65px rgba(15,23,42,.09);
            text-align: center;
        }

        .forgot-icon {
            width: 65px;
            height: 65px;
            margin: auto auto 22px;
            border-radius: 18px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .forgot-card > span {
            color: #4f46e5;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.3px;
        }

        .forgot-card h1 {
            font-size: 27px;
            margin: 8px 0;
        }

        .forgot-card > p {
            color: #64748b;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 27px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .form-input {
            width: 100%;
            height: 46px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            padding: 0 42px;
            outline: none;
            font-size: 13px;
        }

        .form-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99,102,241,.1);
        }

        .forgot-submit {
            width: 100%;
            height: 46px;
            margin-top: 5px;
        }

        .back-login {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 700;
            margin-top: 23px;
        }

        .success-box {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            border-radius: 9px;
            padding: 13px;
            font-size: 11px;
            text-align: left;
            margin-bottom: 18px;
        }

        .error-box {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 9px;
            padding: 13px;
            font-size: 11px;
            text-align: left;
            margin-bottom: 18px;
        }

        .field-error {
            display: block;
            color: #dc2626;
            font-size: 10px;
            margin-top: 5px;
        }

        .input-error {
            border-color: #ef4444 !important;
        }

        @media(max-width:500px) {

            .forgot-card {
                padding: 35px 23px;
            }

        }

    </style>

</head>


<body>

<div class="auth-page">

    <header class="auth-navbar">

        <div class="auth-navbar-inner">

            <a href="../index.html" class="logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div>
                    <span class="logo-title">SCMS</span>
                    <small>Learning Platform</small>
                </div>

            </a>

            <a
                href="../index.html"
                class="back-home"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </header>


    <main class="auth-main">

        <div class="forgot-card">

            <div class="forgot-icon">
                <i class="fa-solid fa-key"></i>
            </div>

            <span>ACCOUNT RECOVERY</span>

            <h1>
                Forgot Your Password?
            </h1>

            <p>
                Enter your registered email address.
                We will help you recover access to your account.
            </p>


            <div
                class="success-box"
                id="successBox"
            >
                Your account was found. For this frontend
                version, you can return to login and use your
                registered password.
            </div>


            <div
                class="error-box"
                id="errorBox"
            ></div>


            <form id="forgotForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter your registered email"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary forgot-submit"
                >
                    Recover Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <a
                href="login.html"
                class="back-login"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back to Student Login
            </a>

        </div>

    </main>

</div>


<script src="../js/data.js"></script>
<script src="../js/state.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/validation.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "forgotForm"
            );

        const email =
            document.getElementById("email");

        const successBox =
            document.getElementById(
                "successBox"
            );

        const errorBox =
            document.getElementById(
                "errorBox"
            );


        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                clearFieldError(email);

                successBox.style.display =
                    "none";

                errorBox.style.display =
                    "none";


                if (
                    !validateEmail(
                        email.value
                    )
                ) {

                    showFieldError(
                        email,
                        "Please enter a valid email address."
                    );

                    return;
                }


                const students =
                    getStudents();


                const student =
                    students.find(
                        user =>
                            user.email.toLowerCase() ===
                            email.value.trim().toLowerCase()
                    );


                if (!student) {

                    errorBox.textContent =
                        "No student account was found with this email address.";

                    errorBox.style.display =
                        "block";

                    return;
                }


                successBox.style.display =
                    "block";

                form.reset();

            }
        );

    }
);

</script>

</body>
</html>
