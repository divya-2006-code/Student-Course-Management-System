<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | SCMS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
    color:#1e293b;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:linear-gradient(180deg,#4338ca,#2563eb);
    color:white;
    padding:25px 15px;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 12px 30px;
}

.logo-icon{
    width:45px;
    height:45px;
    background:white;
    color:#4338ca;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;
}

.logo h2{
    font-size:20px;
}

.logo span{
    font-size:11px;
    opacity:.8;
    display:block;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menu a{
    color:#e0e7ff;
    text-decoration:none;
    padding:13px 15px;
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
}

.menu a:hover,
.menu a.active{
    background:rgba(255,255,255,.18);
    color:white;
}

.logout{
    position:absolute;
    bottom:25px;
    left:15px;
    right:15px;
}

.main{
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:75px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
}

.topbar h3{
    font-family:'Montserrat',sans-serif;
    font-size:21px;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:42px;
    height:42px;
    background:#e0e7ff;
    color:#4338ca;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.content{
    padding:35px;
}

.hero{
    background:linear-gradient(135deg,#4338ca,#2563eb);
    color:white;
    padding:30px;
    border-radius:18px;
    margin-bottom:25px;
}

.hero h1{
    font-size:27px;
    margin-bottom:7px;
}

.hero p{
    opacity:.9;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(15,23,42,.06);
}

.stat small{
    color:#64748b;
}

.stat h2{
    color:#4338ca;
    font-size:27px;
    margin-top:7px;
}

.toolbar{
    background:white;
    padding:18px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter{
    border:1px solid #dbe1ea;
    background:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
}

.filter.active{
    background:#4338ca;
    color:white;
    border-color:#4338ca;
}

.mark-all{
    border:0;
    background:#eef2ff;
    color:#4338ca;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
}

.notifications{
    display:grid;
    gap:12px;
}

.notification{
    background:white;
    border-radius:14px;
    padding:20px;
    display:flex;
    gap:15px;
    border-left:4px solid #4338ca;
    box-shadow:0 4px 15px rgba(15,23,42,.05);
}

.notification.unread{
    background:#eef2ff;
}

.notification-icon{
    min-width:45px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#e0e7ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.notification-body{
    flex:1;
}

.notification-body h3{
    font-size:15px;
    margin-bottom:5px;
}

.notification-body p{
    color:#64748b;
    font-size:13px;
    line-height:1.6;
}

.notification-body small{
    display:block;
    color:#94a3b8;
    margin-top:8px;
}

.read-btn{
    border:0;
    background:transparent;
    color:#4338ca;
    cursor:pointer;
    font-size:12px;
    white-space:nowrap;
}

.empty{
    background:white;
    padding:45px;
    text-align:center;
    color:#64748b;
    border-radius:15px;
}

.mobile-btn{
    display:none;
}

@media(max-width:700px){

    .sidebar{
        transform:translateX(-100%);
        transition:.3s;
    }

    .sidebar.show{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .mobile-btn{
        display:block;
        border:0;
        background:#4338ca;
        color:white;
        width:40px;
        height:40px;
        border-radius:8px;
        font-size:20px;
    }

    .content{
        padding:20px;
    }

    .topbar{
        padding:0 20px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .toolbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .notification{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">S</div>

        <div>
            <h2>SCMS</h2>
            <span>Learning Portal</span>
        </div>
    </div>

    <nav class="menu">

        <a href="dashboard.html">🏠 Dashboard</a>

        <a href="courses.html">📚 Browse Courses</a>

        <a href="my-courses.html">🎓 My Courses</a>

        <a href="progress.html">📊 Progress</a>

        <a href="certificate.html">🏆 Certificates</a>

        <a href="notifications.html" class="active">
            🔔 Notifications
        </a>

        <a href="profile.html">👤 Profile</a>

        <a href="help.html">❓ Help</a>

    </nav>

    <div class="logout">
        <a href="#" onclick="logoutUser()" class="menu">
            🚪 Logout
        </a>
    </div>

</aside>

<main class="main">

<header class="topbar">

    <div style="display:flex;align-items:center;gap:15px;">

        <button class="mobile-btn"
                onclick="toggleSidebar()">
            ☰
        </button>

        <h3>Notifications</h3>

    </div>

    <div class="profile">

        <div class="avatar" id="avatar">S</div>

        <span id="studentName">Student</span>

    </div>

</header>

<section class="content">

    <div class="hero">

        <h1>Stay Updated 🔔</h1>

        <p>
            View important updates about your courses,
            learning activities and SCMS.
        </p>

    </div>

    <div class="stats">

        <div class="stat">

            <small>Total Notifications</small>

            <h2 id="totalNotifications">0</h2>

        </div>

        <div class="stat">

            <small>Unread Notifications</small>

            <h2 id="unreadNotifications">0</h2>

        </div>

    </div>

    <div class="toolbar">

        <div class="filters">

            <button class="filter active"
                    onclick="setFilter('all',this)">
                All
            </button>

            <button class="filter"
                    onclick="setFilter('unread',this)">
                Unread
            </button>

            <button class="filter"
                    onclick="setFilter('course',this)">
                Courses
            </button>

            <button class="filter"
                    onclick="setFilter('system',this)">
                System
            </button>

        </div>

        <button class="mark-all"
                onclick="markAllRead()">
            Mark All as Read
        </button>

    </div>

    <div id="notificationList"
         class="notifications">
    </div>

</section>

</main>

<script>

let currentFilter = "all";

function getStudent(){

    let data = localStorage.getItem("studentSession");

    if(data){

        try{
            return JSON.parse(data);
        }catch(e){}

    }

    data = localStorage.getItem("loggedInStudent");

    if(data){

        try{
            return JSON.parse(data);
        }catch(e){}

    }

    return null;
}

function getStorageKey(){

    const student = getStudent();

    if(student && student.email){

        return "studentNotifications_" +
               student.email.toLowerCase();

    }

    return "studentNotifications";
}

function getNotifications(){

    const key = getStorageKey();

    const saved = localStorage.getItem(key);

    if(saved){

        try{
            return JSON.parse(saved);
        }catch(e){}
    }

    const defaults = [

        {
            id:1,
            title:"Welcome to SCMS",
            message:"Welcome to the Student Course Management System. Start exploring courses and begin your learning journey.",
            type:"system",
            icon:"👋",
            read:false,
            date:new Date().toISOString()
        },

        {
            id:2,
            title:"New Courses Available",
            message:"New professional courses are available in Web Development, Programming, Data Science and Artificial Intelligence.",
            type:"course",
            icon:"📚",
            read:false,
            date:new Date().toISOString()
        },

        {
            id:3,
            title:"Complete Your Learning",
            message:"Continue your enrolled courses and complete the remaining lessons to earn certificates.",
            type:"course",
            icon:"🎓",
            read:false,
            date:new Date().toISOString()
        },

        {
            id:4,
            title:"Profile Reminder",
            message:"Keep your student profile information updated for a better learning experience.",
            type:"system",
            icon:"👤",
            read:true,
            date:new Date().toISOString()
        }

    ];

    localStorage.setItem(
        key,
        JSON.stringify(defaults)
    );

    return defaults;
}

function saveNotifications(data){

    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(data)
    );

}

function formatDate(date){

    const d = new Date(date);

    if(isNaN(d.getTime())){
        return "Recently";
    }

    return d.toLocaleDateString() +
           " • " +
           d.toLocaleTimeString([],{
               hour:"2-digit",
               minute:"2-digit"
           });

}

function renderNotifications(){

    const all = getNotifications();

    const unread =
        all.filter(item => !item.read).length;

    document.getElementById(
        "totalNotifications"
    ).textContent = all.length;

    document.getElementById(
        "unreadNotifications"
    ).textContent = unread;

    let filtered = all;

    if(currentFilter === "unread"){

        filtered =
            all.filter(item => !item.read);

    }

    if(
        currentFilter === "course" ||
        currentFilter === "system"
    ){

        filtered =
            all.filter(item =>
                item.type === currentFilter
            );

    }

    const container =
        document.getElementById(
            "notificationList"
        );

    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h3>No Notifications</h3>

                <p>
                    There are no notifications in this category.
                </p>

            </div>

        `;

        return;

    }

    container.innerHTML = "";

    filtered.forEach(item => {

        container.innerHTML += `

            <div class="notification
                        ${item.read ? "" : "unread"}">

                <div class="notification-icon">
                    ${item.icon || "🔔"}
                </div>

                <div class="notification-body">

                    <h3>${item.title}</h3>

                    <p>${item.message}</p>

                    <small>
                        ${formatDate(item.date)}
                    </small>

                </div>

                ${
                    item.read
                    ? `<span style="color:#94a3b8;font-size:12px;">
                        Read
                       </span>`
                    : `
                    <button class="read-btn"
                            onclick="markRead(${item.id})">
                        Mark as Read
                    </button>
                    `
                }

            </div>

        `;

    });

}

function markRead(id){

    const data = getNotifications();

    const item =
        data.find(notification =>
            notification.id === id
        );

    if(item){

        item.read = true;

        saveNotifications(data);

        renderNotifications();

    }

}

function markAllRead(){

    const data = getNotifications();

    data.forEach(item => {
        item.read = true;
    });

    saveNotifications(data);

    renderNotifications();

}

function setFilter(filter,button){

    currentFilter = filter;

    document
        .querySelectorAll(".filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderNotifications();

}

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("show");

}

function logoutUser(){

    localStorage.removeItem("studentSession");
    localStorage.removeItem("loggedInStudent");

    window.location.href = "login.html";

}

function loadStudent(){

    const student = getStudent();

    if(!student){

        window.location.href = "login.html";
        return;

    }

    const name =
        student.name ||
        student.fullName ||
        "Student";

    document.getElementById(
        "studentName"
    ).textContent = name;

    document.getElementById(
        "avatar"
    ).textContent =
        name.charAt(0).toUpperCase();

    renderNotifications();

}

loadStudent();

</script>

</body>
</html>
